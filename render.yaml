services:
  - type: web
    name: easy-elevenlabs-poc
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: POC_ACCESS_PASSWORD
        sync: false
      - key: POC_SESSION_SECRET
        generateValue: true
      - key: ENFORCE_MOCK_API_KEY
        value: "true"
      - key: MOCK_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_AGENT_ID
        sync: false
      - key: ELEVENLABS_ENVIRONMENT
        value: production
      - key: USE_REAL_CENCOSUD_API
        value: "true"
      - key: CENCOSUD_SEARCH_URL
        value: https://6gdmad8bye.execute-api.us-east-1.amazonaws.com/v1/graphql
      - key: CENCOSUD_SEARCH_USER_AGENT
        value: ElevenLabs/1.0
      - key: CENCOSUD_SEARCH_TIMEOUT_MS
        value: "10000"
      - key: CENCOSUD_APPLICATION_ID
        value: 34bb8686968a85a272a6c546ddcb9860db1ea14ee72f5207ef0c028280a6e7bc
      - key: CENCOSUD_SEARCH_BASE_URL
        sync: false
      - key: CENCOSUD_SEARCH_API_KEY
        sync: false
